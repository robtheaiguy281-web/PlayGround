<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b17">
<title>NEON DRIFT — Skyline Run</title>
<style>
:root{color-scheme:dark;--bg:#070b17;--panel:#111a2c;--line:#253651;--cyan:#62f0ff;--pink:#ff5ca8;--gold:#ffd36b;--muted:#91a5c2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#182647 0,transparent 58%),var(--bg);color:#eff7ff;overflow-x:hidden}.app{width:min(1120px,100%);margin:auto;padding:20px 24px 24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 16px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#193a52,#191d38);border:1px solid #335c73;color:var(--cyan);font-size:23px;box-shadow:0 0 24px #31d9ff22}.eyebrow{font-size:10px;letter-spacing:.25em;color:var(--cyan);font-weight:800}.brand h1{font-size:19px;letter-spacing:.06em;margin:2px 0 0;font-weight:850}.top-actions{display:flex;align-items:center;gap:8px}.pill{border:1px solid #2c405b;color:#b5c5d9;background:#10192a;padding:8px 11px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.08em}.sound-btn{width:38px;height:38px;border-radius:12px;background:#111a2c;border:1px solid #2d405b;color:#d9eaff;cursor:pointer;font-size:16px}.sound-btn:hover{border-color:var(--cyan);color:var(--cyan)}.game-shell{position:relative;overflow:hidden;border:1px solid #2a4262;border-radius:21px;background:#090f1d;box-shadow:0 24px 80px #0008,0 0 48px #176b9b16}.game-canvas{display:block;width:100%;height:min(68vh,650px);min-height:440px;touch-action:none}.hud{position:absolute;inset:0 0 auto;z-index:2;padding:17px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.hud-group{display:flex;gap:9px}.stat{min-width:94px;padding:9px 12px;border:1px solid #c1e9ff25;background:#091322b8;backdrop-filter:blur(10px);border-radius:12px}.stat-label{color:#93aac2;font-size:9px;font-weight:800;letter-spacing:.18em}.stat-value{margin-top:3px;font-size:20px;line-height:1;font-weight:850;font-variant-numeric:tabular-nums}.stat-value.cyan{color:var(--cyan)}.stat-value.gold{color:var(--gold)}.stat-value.pink{color:var(--pink)}.hud-right{display:flex;gap:8px;align-items:flex-start}.icon-btn{pointer-events:auto;width:40px;height:40px;border-radius:12px;color:#e5f4ff;background:#091322bb;border:1px solid #c1e9ff30;cursor:pointer;font-size:16px}.icon-btn:hover{border-color:var(--cyan);color:var(--cyan)}.overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#070c18a8,#080d1cc9);backdrop-filter:blur(4px);transition:opacity .2s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.modal{width:min(420px,100%);text-align:center;padding:30px 28px;border:1px solid #46718b77;border-radius:22px;background:linear-gradient(145deg,#101d31ef,#0c1425f2);box-shadow:0 20px 70px #0009}.modal-kicker{font-size:10px;font-weight:900;letter-spacing:.3em;color:var(--cyan)}.modal h2{margin:10px 0 8px;font-size:clamp(28px,5vw,43px);line-height:1;letter-spacing:-.04em}.modal p{margin:0 auto 20px;max-width:330px;color:#aec1d8;font-size:13px;line-height:1.6}.primary{border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(100deg,#04a9c8,#47e3df);box-shadow:0 7px 25px #13cde344;color:#061522;font-weight:900;letter-spacing:.1em;cursor:pointer}.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}.modal-note{margin-top:14px!important;font-size:10px!important;color:#8296b2!important}.result{display:flex;justify-content:center;gap:28px;margin:18px 0}.result strong{display:block;font-size:22px}.result span{font-size:9px;letter-spacing:.16em;color:#95a9c2}.below{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;margin-top:12px}.tip{display:flex;gap:8px;align-items:center;color:#8da2bd;font-size:11px}.keycap{display:inline-grid;place-items:center;min-width:25px;height:24px;padding:0 6px;border:1px solid #324664;border-radius:6px;background:#111a2b;color:#b9d1e8;font-size:10px;font-weight:800}.boost-wrap{display:flex;align-items:center;gap:10px}.boost-label{font-size:9px;letter-spacing:.16em;font-weight:900;color:#9eb2cb}.boost-track{width:112px;height:7px;border-radius:8px;background:#1a2c42;overflow:hidden}.boost-fill{height:100%;width:0;background:linear-gradient(90deg,#ff9e59,#ffe36b);box-shadow:0 0 12px #ffd36b;transition:width .12s}.boost-btn{padding:9px 13px;border:1px solid #6b5260;border-radius:10px;background:#281a2a;color:#ffc1cf;font-size:10px;font-weight:900;letter-spacing:.12em;cursor:pointer}.boost-btn.ready{color:#07141b;background:linear-gradient(100deg,#ff9a61,#ffe16d);border-color:#ffe16d}.boost-btn:disabled{opacity:.5;cursor:default}.mobile-controls{display:none;justify-content:space-between;align-items:center;margin-top:12px;gap:14px}.move-controls{display:flex;gap:9px}.touch-btn{width:56px;height:48px;border-radius:14px;border:1px solid #2c4563;background:#111b2d;color:#dcf4ff;font-size:21px;touch-action:manipulation;user-select:none}.touch-btn:active{background:#1b3c53;border-color:var(--cyan)}.mobile-boost{display:none}.footer{margin-top:18px;display:flex;justify-content:space-between;color:#576b86;font-size:10px;letter-spacing:.08em}.footer strong{color:#8399b3}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.app{padding:12px 12px calc(14px + env(safe-area-inset-bottom))}.topbar{margin-bottom:10px}.brand-mark{width:36px;height:36px}.brand h1{font-size:15px}.eyebrow{font-size:8px}.pill{font-size:9px;padding:7px 8px}.game-shell{border-radius:15px}.game-canvas{height:min(61vh,610px);min-height:390px}.hud{padding:10px}.stat{min-width:68px;padding:7px 9px;border-radius:10px}.stat-label{font-size:8px}.stat-value{font-size:17px}.icon-btn{width:36px;height:36px}.below{grid-template-columns:1fr;gap:9px;margin-top:9px}.tip{font-size:10px}.boost-wrap{display:none}.mobile-controls{display:flex}.mobile-boost{display:block}.footer{font-size:8px;margin-top:14px}}@media(max-height:700px) and (min-width:701px){.game-canvas{height:62vh;min-height:390px}.app{padding-top:12px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="eyebrow">A NEON CITY SURVIVAL RUN</div><h1>NEON DRIFT <span style="color:#71849e">/</span> SKYLINE RUN</h1></div></div><div class="top-actions"><span class="pill">ENDLESS • 3 LANES</span><button class="sound-btn" id="soundBtn" aria-label="Toggle sound" title="Toggle sound">♪</button></div></header>
<section class="game-shell" aria-label="Neon Drift game">
<canvas class="game-canvas" id="game" aria-label="Three-lane neon hover racer game"></canvas>
<div class="hud"><div class="hud-group"><div class="stat"><div class="stat-label">SCORE</div><div class="stat-value cyan" id="score">00000</div></div><div class="stat"><div class="stat-label">BEST</div><div class="stat-value gold" id="best">00000</div></div></div><div class="hud-right"><div class="stat"><div class="stat-label">DISTANCE</div><div class="stat-value" id="distance">0<span style="font-size:11px;color:#91a5c2"> m</span></div></div><button class="icon-btn" id="pauseBtn" aria-label="Pause game" title="Pause">Ⅱ</button></div></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</section>
<div class="below"><div class="tip"><span class="keycap">←</span><span class="keycap">→</span> Switch lanes <span style="margin-left:7px" class="keycap">SPACE</span> Boost <span>· Collect sparks, dodge traffic</span></div><div class="boost-wrap"><span class="boost-label">BOOST</span><div class="boost-track"><div class="boost-fill" id="boostFill"></div></div><button class="boost-btn" id="boostBtn">HOLD TO BOOST</button></div></div>
<div class="mobile-controls"><div class="move-controls"><button class="touch-btn" id="leftBtn" aria-label="Move left">‹</button><button class="touch-btn" id="rightBtn" aria-label="Move right">›</button></div><button class="boost-btn mobile-boost" id="mobileBoost">⚡ BOOST</button></div>
<footer class="footer"><span><strong>SECTOR 07</strong> &nbsp;•&nbsp; AFTERGLOW DISTRICT</span><span>PERSONAL BEST SAVED ON THIS DEVICE</span></footer>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),ui={overlay:$('overlay'),modal:$('modal'),score:$('score'),best:$('best'),distance:$('distance'),boostFill:$('boostFill'),boostBtn:$('boostBtn'),mobileBoost:$('mobileBoost'),pause:$('pauseBtn')};
const savedBest=Number(localStorage.getItem('neonDriftBest')||0);let best=savedBest,state='ready',lane=0,playerLane=0,score=0,meters=0,speed=30,energy=0,boosting=false,spawnIn=1,objects=[],particles=[],shake=0,flash=0,last=0,worldTime=0,soundOn=false,audio=null;
let W=0,H=0,dpr=1,stars=[],buildings=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),fmt=n=>String(Math.floor(n)).padStart(5,'0');
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H*.48,r:Math.random()*1.5+.25,a:Math.random()*.55+.15,phase:Math.random()*6}));buildings=[];let x=-8;while(x<W+20){let w=rand(22,70),h=rand(H*.1,H*.33);buildings.push({x,w,h,seed:Math.random(),rows:Math.floor(h/10),cols:Math.floor(w/9)});x+=w+rand(3,10)}}
new ResizeObserver(resize).observe(canvas);resize();
function showOverlay(kind){ui.overlay.classList.remove('hidden');if(kind==='ready'){ui.modal.innerHTML='<div class="modal-kicker">THE CITY NEVER SLEEPS</div><h2>OWN THE<br><span style="color:#62f0ff">NIGHT RUN.</span></h2><p>Thread the neon traffic, grab energy sparks, and see how far your rig can go. The road gets faster the longer you survive.</p><button class="primary" id="startBtn">START YOUR RUN&nbsp; →</button><p class="modal-note">MOVE: ← → OR A / D &nbsp;·&nbsp; BOOST: HOLD SPACE</p>';}
else if(kind==='pause'){ui.modal.innerHTML='<div class="modal-kicker">RUN PAUSED</div><h2>TAKE A<br><span style="color:#62f0ff">BREATHER.</span></h2><p>Your run is saved right where you left it. Ready to get back out there?</p><button class="primary" id="resumeBtn">RESUME RUN&nbsp; →</button><p class="modal-note">PRESS ESC OR P TO RESUME</p>';}
else{ui.modal.innerHTML='<div class="modal-kicker">RUN COMPLETE</div><h2>YOU OWNED<br><span style="color:#ff5ca8">THE NIGHT.</span></h2><div class="result"><div><strong>'+fmt(score)+'</strong><span>FINAL SCORE</span></div><div><strong>'+Math.floor(meters)+'m</strong><span>DISTANCE</span></div><div><strong>'+fmt(best)+'</strong><span>BEST</span></div></div><p>The city is still out there. One more run?</p><button class="primary" id="startBtn">RUN IT BACK&nbsp; →</button><p class="modal-note">TAP OR PRESS ENTER TO PLAY AGAIN</p>';}
const start=$('startBtn'),resume=$('resumeBtn');if(start)start.onclick=startGame;if(resume)resume.onclick=resumeGame;}
function startGame(){state='playing';lane=0;playerLane=0;score=0;meters=0;speed=30;energy=0;boosting=false;spawnIn=.8;objects=[];particles=[];shake=0;flash=0;ui.overlay.classList.add('hidden');ui.pause.textContent='Ⅱ';updateHud();}
function pauseGame(){if(state!=='playing')return;state='paused';boosting=false;ui.pause.textContent='▶';showOverlay('pause')}
function resumeGame(){if(state!=='paused')return;state='playing';ui.pause.textContent='Ⅱ';ui.overlay.classList.add('hidden');last=performance.now()}
function endGame(){if(state!=='playing')return;state='over';boosting=false;if(score>best){best=score;localStorage.setItem('neonDriftBest',best)}updateHud();showOverlay('over')}
function updateHud(){ui.score.textContent=fmt(score);ui.best.textContent=fmt(best);ui.distance.innerHTML=Math.floor(meters)+'<span style="font-size:11px;color:#91a5c2"> m</span>';ui.boostFill.style.width=energy+'%';const ready=energy>2;ui.boostBtn.classList.toggle('ready',ready);ui.mobileBoost.classList.toggle('ready',ready);ui.boostBtn.disabled=!ready;ui.mobileBoost.disabled=!ready}
function move(dir){if(state==='ready'||state==='over'){startGame();return}if(state!=='playing')return;lane=clamp(lane+dir,-1,1);}
function setBoost(on){boosting=!!on&&state==='playing'&&energy>1}
function addObject(type,laneNum,d){objects.push({type,lane:laneNum,d,spin:Math.random()*6,hit:false})}
function spawn(){let laneNum=Math.floor(Math.random()*3)-1,typeRoll=Math.random();if(typeRoll<.25){addObject('spark',laneNum,93);if(Math.random()<.38)addObject('spark',clamp(laneNum+(Math.random()<.5?-1:1),-1,1),108)}else{addObject(typeRoll<.62?'barrier':'drone',laneNum,93);if(Math.random()<.18)addObject('spark',Math.floor(Math.random()*3)-1,111)}spawnIn=rand(.62,1.05)*Math.max(.63,1-(speed-30)*.009)}
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function roadPoint(t){const half=W*(.045+.425*t);return{y:H*.39+(H*.61)*t*t,x:W*.5,half}}
function drawBackground(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#101831');sky.addColorStop(.48,'#292744');sky.addColorStop(.72,'#af4c79');sky.addColorStop(1,'#ff9b72');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const glow=ctx.createRadialGradient(W*.5,H*.43,2,W*.5,H*.43,W*.46);glow.addColorStop(0,'#ffc07988');glow.addColorStop(.35,'#f5787770');glow.addColorStop(1,'#f5787700');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.8);
for(const s of stars){ctx.globalAlpha=s.a*(.65+.35*Math.sin(worldTime*1.1+s.phase));ctx.fillStyle='#d5efff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
const horizon=H*.43;ctx.fillStyle='#22233a';for(const b of buildings){const x=b.x,y=horizon-b.h;ctx.fillRect(x,y,b.w,b.h+2);ctx.fillStyle='#38314e';ctx.fillRect(x+4,y+5,Math.max(3,b.w-8),2);ctx.fillStyle='#f9b46b';for(let r=0;r<b.rows;r++)for(let c=0;c<b.cols;c++){if(Math.sin((r+1)*17+(c+1)*31+b.seed*100)>.13){ctx.globalAlpha=.35+Math.sin(worldTime*1.3+r+c+b.seed)*.1;ctx.fillRect(x+5+c*9,y+13+r*10,2.4,3.2)}}ctx.globalAlpha=1;ctx.fillStyle='#22233a'}
ctx.fillStyle='#ffae74';ctx.fillRect(0,horizon,W,1.5);
// roadside glow and distant city haze
const haze=ctx.createLinearGradient(0,horizon-20,0,horizon+65);haze.addColorStop(0,'#ff7b8270');haze.addColorStop(1,'#ff7b8200');ctx.fillStyle=haze;ctx.fillRect(0,horizon-20,W,85);
}
function drawRoad(){const top=roadPoint(0),bottom=roadPoint(1);poly([[top.x-top.half,top.y],[top.x+top.half,top.y],[bottom.x+bottom.half,bottom.y],[bottom.x-bottom.half,bottom.y]],'#131a2d','#f69aaf66',1);
poly([[top.x-top.half,top.y],[top.x-top.half+W*.012,top.y],[bottom.x-bottom.half+W*.024,bottom.y],[bottom.x-bottom.half,bottom.y]],'#ff4f8e22');poly([[top.x+top.half-W*.012,top.y],[top.x+top.half,top.y],[bottom.x+bottom.half,bottom.y],[bottom.x+bottom.half-W*.024,bottom.y]],'#ff4f8e22');
// sweeping lane dashes recede into the horizon
for(let side of [-1,1]){for(let i=0;i<18;i++){let p=((i/18+worldTime*(speed/190))%1);let t=p;let q=roadPoint(t);let x=q.x+side*q.half/3;let len=2+26*t;ctx.globalAlpha=.16+.55*t;ctx.strokeStyle='#7edff5';ctx.lineWidth=1+2*t;ctx.beginPath();ctx.moveTo(x,q.y-len/2);ctx.lineTo(x,q.y+len/2);ctx.stroke()}ctx.globalAlpha=1}
// road center perspective bars
for(let i=0;i<13;i++){const p=((i/13+worldTime*(speed/230))%1),t=p*p,q=roadPoint(t);ctx.globalAlpha=.035+.09*t;ctx.strokeStyle='#d7efff';ctx.lineWidth=1+t;ctx.beginPath();ctx.moveTo(q.x-q.half,q.y);ctx.lineTo(q.x+q.half,q.y);ctx.stroke()}ctx.globalAlpha=1;
// edge reflectors
for(let i=0;i<16;i++){const p=((i/16+worldTime*(speed/165))%1),t=p*p,q=roadPoint(t);for(const side of [-1,1]){ctx.globalAlpha=.28+.6*t;ctx.fillStyle=side<0?'#62f0ff':'#ff5ca8';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10*t+2;ctx.fillRect(q.x+side*(q.half+2),q.y-2-4*t,2+3*t,2+4*t)}}ctx.shadowBlur=0;ctx.globalAlpha=1}
function project(o){const t=clamp((1-o.d/100)*.882,0,.882),q=roadPoint(t),x=q.x+o.lane*q.half*.57;return{x,y:q.y,scale:.16+t*1.08,t}}
function drawSpark(o,p){const s=13*p.scale,a=worldTime*3+o.spin;ctx.save();ctx.translate(p.x,p.y-17*p.scale);ctx.rotate(a);ctx.shadowColor='#69f8ff';ctx.shadowBlur=20*p.scale+4;poly([[0,-s],[s*.68,0],[0,s],[s*-.68,0]],'#b9ffff','#36dff5',2*p.scale);ctx.shadowBlur=0;ctx.restore();ctx.globalAlpha=.15;ctx.fillStyle='#62f0ff';ctx.beginPath();ctx.ellipse(p.x,p.y,13*p.scale,4*p.scale,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function drawBarrier(p){const s=p.scale,w=38*s,h=28*s,x=p.x,y=p.y;ctx.fillStyle='#050a16aa';ctx.beginPath();ctx.ellipse(x,y+3*s,w*.75,7*s,0,0,Math.PI*2);ctx.fill();poly([[x-w*.5,y-h],[x+w*.5,y-h],[x+w*.38,y],[x-w*.38,y]],'#492a4d','#ff6da5',1.5*s);poly([[x-w*.5,y-h],[x-w*.25,y-h-7*s],[x+w*.68,y-h-7*s],[x+w*.5,y-h]],'#b94978','#ff9cba',1*s);for(let i=0;i<3;i++){ctx.strokeStyle=i%2?'#ffcf68':'#ff668e';ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(x-w*.38+i*12*s,y-h+5*s);ctx.lineTo(x-w*.29+i*10*s,y-3*s);ctx.stroke()}ctx.fillStyle='#ffcf68';ctx.shadowColor='#ff668e';ctx.shadowBlur=10*s;ctx.fillRect(x-w*.45,y-h-3*s,w*.9,2*s);ctx.shadowBlur=0}
function drawDrone(p){const s=p.scale,x=p.x,y=p.y-16*s;ctx.save();ctx.translate(x,y+Math.sin(worldTime*5)*3*s);ctx.shadowColor='#ff4fa6';ctx.shadowBlur=18*s;poly([[-21*s,0],[-13*s,-8*s],[13*s,-8*s],[21*s,0],[14*s,9*s],[-14*s,9*s]],'#401c46','#ff62bc',1.5*s);poly([[-8*s,-7*s],[0,-14*s],[8*s,-7*s]],'#72f8ff','#baffff',1*s);ctx.fillStyle='#ff5ca8';ctx.fillRect(-18*s,10*s,8*s,2*s);ctx.fillRect(10*s,10*s,8*s,2*s);ctx.restore();ctx.shadowBlur=0}
function drawObjects(){const visible=objects.filter(o=>o.d<100&&o.d>-2).sort((a,b)=>b.d-a.d);for(const o of visible){const p=project(o);if(o.type==='spark')drawSpark(o,p);else if(o.type==='barrier')drawBarrier(p);else drawDrone(p)}}
function drawCar(){const t=.72,q=roadPoint(t),x=q.x+playerLane*q.half*.57,y=H*.83;const s=clamp(W/720,.75,1.35),w=34*s,h=59*s;ctx.save();ctx.translate(x,y);ctx.rotate((lane-playerLane)*-.1);ctx.fillStyle='#030713aa';ctx.beginPath();ctx.ellipse(0,4*s,30*s,10*s,0,0,Math.PI*2);ctx.fill();
// hover glow and engine trails
ctx.shadowColor=boosting?'#ffbf57':'#31e7ff';ctx.shadowBlur=boosting?28:18;ctx.fillStyle=boosting?'#ffb34e':'#27d8f6';ctx.globalAlpha=.72;ctx.beginPath();ctx.ellipse(-11*s,19*s,4*s,10*s,0,0,Math.PI*2);ctx.ellipse(11*s,19*s,4*s,10*s,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
poly([[-w*.38,h*.3],[-w*.52,h*.05],[-w*.48,-h*.23],[-w*.25,-h*.48],[w*.25,-h*.48],[w*.48,-h*.23],[w*.52,h*.05],[w*.38,h*.3]],boosting?'#ed9a50':'#27b9db',boosting?'#ffe38b':'#9cf8ff',2*s);
poly([[-w*.31,-h*.12],[-w*.22,-h*.39],[w*.22,-h*.39],[w*.31,-h*.12]],'#142a48','#75eaff',1*s);poly([[-w*.25,-h*.34],[0,-h*.4],[w*.25,-h*.34],[w*.2,-h*.18],[-w*.2,-h*.18]],'#65e4f2aa');
ctx.fillStyle='#f8fdff';ctx.shadowColor='#62f0ff';ctx.shadowBlur=13;ctx.fillRect(-w*.4,h*.08,w*.19,4*s);ctx.fillRect(w*.21,h*.08,w*.19,4*s);ctx.shadowBlur=0;ctx.fillStyle='#ff579f';ctx.fillRect(-w*.3,h*.24,w*.2,3*s);ctx.fillRect(w*.1,h*.24,w*.2,3*s);
if(boosting){ctx.globalAlpha=.32;ctx.strokeStyle='#ffe49c';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-h*.05,w*.75,h*.62,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}ctx.restore()}
function burst(x,y,color){for(let i=0;i<13;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-130,20),life:rand(.35,.8),max:.8,color,size:rand(2,5)})}
function drawParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;particles=particles.filter(p=>p.life>0)}
function draw(dt){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(shake>0){ctx.save();ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.9}drawBackground();drawRoad();drawObjects();drawCar();drawParticles(dt);if(shake>0.3)ctx.restore();else shake=0;if(flash>0){ctx.fillStyle='rgba(255,60,130,'+flash+')';ctx.fillRect(0,0,W,H);flash*=.88}}
function playTone(freq,duration=.08,type='sine'){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function update(dt){worldTime+=dt;if(state!=='playing'){if(state==='ready')speed=30;return}const multiplier=boosting&&energy>0?1.65:1;speed=Math.min(62,30+meters*.075);if(boosting&&energy>0){energy=Math.max(0,energy-34*dt);if(energy===0)boosting=false}else boosting=false;const actualSpeed=speed+(boosting?18:0);meters+=actualSpeed*dt;score+=Math.floor(actualSpeed*dt*1.35);playerLane+=(lane-playerLane)*Math.min(1,dt*11);spawnIn-=dt;if(spawnIn<=0)spawn();
for(const o of objects){const before=o.d;o.d-=actualSpeed*dt;if(before>4&&o.d<=4&&!o.hit){o.hit=true;if(o.type==='spark'){score+=150;energy=Math.min(100,energy+21);const p=project(o);burst(p.x,p.y-18*p.scale,'#6bf5ff');playTone(720,.12,'triangle')}else if(Math.abs(lane-o.lane)<.5){shake=10;flash=.3;playTone(90,.32,'sawtooth');endGame();break}}}
objects=objects.filter(o=>o.d>-4);if(state==='playing'){if(boosting){score+=Math.floor(20*dt);if(Math.random()<dt*14)particles.push({x:W*.5+rand(-40,40),y:H*.8+rand(0,45),vx:rand(-20,20),vy:rand(-140,-50),life:.4,max:.4,color:'#ffd36b',size:rand(2,4)})}updateHud()}}
function frame(now){const dt=Math.min(.04,(now-(last||now))/1000);last=now;update(dt);draw(dt);requestAnimationFrame(frame)}
function bindBoost(button){button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture?.(e.pointerId);setBoost(true)});button.addEventListener('pointerup',()=>setBoost(false));button.addEventListener('pointercancel',()=>setBoost(false));button.addEventListener('lostpointercapture',()=>setBoost(false));button.addEventListener('contextmenu',e=>e.preventDefault())}
bindBoost(ui.boostBtn);bindBoost(ui.mobileBoost);
$('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});$('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
ui.pause.addEventListener('click',()=>state==='paused'?resumeGame():pauseGame());
$('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫':'♪';e.currentTarget.style.color=soundOn?'#62f0ff':'';if(soundOn)playTone(520,.08)});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','arrowup'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')move(-1);else if(k==='arrowright'||k==='d')move(1);else if(k===' '||k==='arrowup'){if(state==='ready'||state==='over')startGame();else setBoost(true)}else if(k==='escape'||k==='p'){if(state==='playing')pauseGame();else if(state==='paused')resumeGame()}else if(k==='enter'&&(state==='ready'||state==='over'))startGame()});
window.addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp')setBoost(false)});
let touchStart=null;canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY,time:Date.now()}});canvas.addEventListener('pointerup',e=>{if(!touchStart||state!=='playing')return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(dx<0?-1:1);else if(Math.abs(dx)<15&&Math.abs(dy)<15){const r=canvas.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)}touchStart=null});
window.addEventListener('pointerup',()=>setBoost(false));document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame()});
updateHud();showOverlay('ready');requestAnimationFrame(frame);



</script>
